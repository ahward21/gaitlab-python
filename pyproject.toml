[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaitlab"
version = "0.1.0"
description = "Lightweight Python LSL lab: connect sensors, custom metrics, live graphs, CSV recording"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gait Lab" }]
dependencies = [
  "numpy>=1.24",
  "pylsl>=1.16",
  "PySide6>=6.5",
  "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gaitlab = "gaitlab.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gaitlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
